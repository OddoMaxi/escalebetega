worker_processes auto;

events {
    worker_connections 1024;
}

# --- Layer 4: SNI-based TCP passthrough on 443. ---
# Nobody's TLS is re-terminated here — each backend keeps handling its
# own certificates exactly as before. We only read the SNI hostname
# from the TLS ClientHello to decide where to forward the raw bytes.
stream {
    map $ssl_preread_server_name $backend {
        cgsassurances.com          koby_upstream;
        www.cgsassurances.com      koby_upstream;
        escalebetega.com           escale_upstream;
        www.escalebetega.com       escale_upstream;
        default                    koby_upstream;
    }

    upstream koby_upstream {
        server koby_nginx:443;
    }

    upstream escale_upstream {
        server escale_caddy:443;
    }

    server {
        listen 443;
        listen [::]:443;
        proxy_pass $backend;
        ssl_preread on;
    }
}

# --- Layer 7: plain HTTP on 80, routed by Host header. ---
# Needed for ACME HTTP-01 challenges and http->https redirects, which
# each backend (koby's certbot, Caddy's ACME) still handles itself.
http {
    server {
        listen 80;
        listen [::]:80;
        server_name cgsassurances.com www.cgsassurances.com;

        location / {
            proxy_pass http://koby_nginx:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name escalebetega.com www.escalebetega.com;

        location / {
            proxy_pass http://escale_caddy:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        return 444;
    }
}
